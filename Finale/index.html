<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finale</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #dc450e 0%, #764ba2 65%);
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        main {
            padding: 40px;
            color: white;
        }

        h1 {
            font-size: 3em;
            margin-bottom: 20px;
        }

        p {
            font-size: 1.2em;
            line-height: 1.6;
        }

        svg {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: auto;
        }

        main {
            position: relative;
            z-index: 10;
        }
    </style>
</head>
<body>
    <!-- Landscape SVG -->
    <svg viewBox="0 0 1000 400" preserveAspectRatio="xMidYMid slice">
        <!-- Sky background is handled by body gradient -->
        
        <!-- Sun -->
        <circle cx="150" cy="80" r="60" fill="#FFD700" opacity="0.9"/>
        
        <!-- Mountains -->
        <polygon points="0,250 200,100 400,250" fill="#8B5A3C" opacity="1"/>
        <polygon points="300,250 450,80 600,250" fill="#A0522D" opacity="1"/>
        <polygon points="550,250 750,120 950,250" fill="#8B4513" opacity="1"/>
        
        <!-- Snow on Mountains -->
        <polygon points="125,160 200,100 275,160" fill="#FFFFFF" opacity="0.9"/>
        <polygon points="400,140 450,80 500,140" fill="#FFFFFF" opacity="0.9"/>
        <polygon points="690,160 750,120 810,160" fill="#FFFFFF" opacity="0.9"/>
        
        <!-- Spaceship in Sky -->
        <g transform="rotate(-90 800 25)">
            <!-- Nose cone -->
            <polygon points="800,-30 794,0 806,0" fill="#FF6B6B"/>
            <!-- Main body -->
            <rect x="791" y="0" width="18" height="30" fill="#4A90E2" rx="3"/>
            <!-- Windows -->
            <circle cx="794" cy="8" r="2" fill="#FFD700"/>
            <circle cx="800" cy="8" r="2" fill="#FFD700"/>
            <circle cx="806" cy="8" r="2" fill="#FFD700"/>
            <!-- Thrusters -->
            <rect x="788" y="20" width="5" height="15" fill="#FF4444"/>
            <rect x="812" y="20" width="5" height="15" fill="#FF4444"/>
            <!-- Flames -->
            <polygon points="791,35 789,45 793,35" fill="#FFA500" opacity="0.7"/>
            <polygon points="809,35 807,45 811,35" fill="#FFA500" opacity="0.7"/>
        </g>
        
        <!-- Hills -->
        <ellipse cx="200" cy="320" rx="450" ry="100" fill="#90EE90" opacity="0.9"/>
        <ellipse cx="700" cy="340" rx="550" ry="120" fill="#7CCD7C" opacity="0.85"/>
        
        <!-- Trees -->
        <g>
            <!-- Tree 1 -->
            <rect x="120" y="220" width="15" height="60" fill="#654321"/>
            <polygon points="127.5,200 90,240 165,240" fill="#228B22"/>
            
            <!-- Tree 2 -->
            <rect x="500" y="240" width="20" height="50" fill="#654321"/>
            <polygon points="510,215 460,260 560,260" fill="#228B22"/>
            
            <!-- Tree 3 -->
            <rect x="850" y="200" width="18" height="70" fill="#654321"/>
            <polygon points="859,175 810,225 908,225" fill="#228B22"/>
        </g>
        
        <!-- Ground/Grass -->
        <rect x="0" y="350" width="1000" height="50" fill="#2D5016"/>
    </svg>

    <main>
        
    </main>

    <script src="Final.js"></script>
</body>
</html>
